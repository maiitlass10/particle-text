<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Particle Text</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="canvas"></canvas>

  <form class="panel" id="form" autocomplete="off">
    <input id="word" maxlength="14" placeholder="Type a word..." aria-label="Word to draw">
    <button type="submit">Draw</button>
  </form>

  <p class="hint">Move your mouse through the text · Click to explode</p>

  <script src="main.js"></script>
</body>
</html>
